<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScamX — Student Opportunity Verification, AI Career Assistant & Mentors</title>
  <meta name="description" content="Dual-surface AI authenticity scanner, verified internship feed, career preparation assistant, and mentor network protecting students from fraudulent job offers." />
  <link rel="stylesheet" href="/static/css/design-system.css" />
  <!-- Fallback local relative path if served directly -->
  <link rel="stylesheet" href="./css/design-system.css" />
</head>
<body>

  <div class="app-container">
    <!-- Navbar Header -->
    <header class="navbar">
      <a href="#" class="brand-logo" id="brand-home-link">
        <div class="logo-badge">⚡</div>
        <div class="brand-title">Scam<span>X</span></div>
      </a>

      <!-- Primary Navigation (Scanner, Career AI, Verified Jobs, Forum, Mentors, Vault) -->
      <nav class="nav-links">
        <button class="nav-btn active" data-tab="scanner" id="nav-scanner-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Scanner
        </button>
        <button class="nav-btn" data-tab="chat" id="nav-chat-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/></svg>
          Career AI
        </button>
        <button class="nav-btn" data-tab="feed" id="nav-feed-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
          Verified Jobs
        </button>
        <button class="nav-btn" data-tab="forum" id="nav-forum-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Forum
        </button>
        <button class="nav-btn" data-tab="mentors" id="nav-mentors-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Mentors & Network
        </button>
        <button class="nav-btn" data-tab="history" id="nav-history-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Vault
        </button>
      </nav>

      <!-- Right Action Area: Live Notification Bell & Multi-Account Switcher -->
      <div class="nav-right">
        <!-- Real-Time Notification Bell Mount Point -->
        <div id="nav-notifications-mount"></div>

        <!-- Account Switcher for Instant Multi-User Testing -->
        <select id="user-account-switcher" class="user-select-btn" title="Switch User Profile for Multi-Account Testing">
          <option value="alex_rivera">👤 Alex Rivera (Student @ UC Berkeley)</option>
          <option value="marcus_vance">🌟 Dr. Marcus Vance (Mentor - AI @ DeepMind)</option>
          <option value="sarah_chen">🌟 Sarah Chen (Mentor - Design @ Canva)</option>
          <option value="priya_sharma">👤 Priya Sharma (Student @ UT Austin)</option>
        </select>
      </div>
    </header>

    <!-- Live Platform Statistics Strip -->
    <section class="hero-stats-bar" aria-label="Community Security Statistics">
      <div class="stat-card">
        <div class="stat-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div>
          <div class="stat-val" id="stat-total-scans">1,428</div>
          <div class="stat-label">Total Scans Run</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon danger">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        </div>
        <div>
          <div class="stat-val" id="stat-scams-prevented">894</div>
          <div class="stat-label">Scams Blocked</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon safe">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>
        </div>
        <div>
          <div class="stat-val" id="stat-verified-listings">5</div>
          <div class="stat-label">Active Verified Listings</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <div>
          <div class="stat-val" id="stat-active-mentors">9</div>
          <div class="stat-label">Verified Mentors Active</div>
        </div>
      </div>
    </section>

    <!-- TAB 1: Multimodal Scanner -->
    <main>
      <section id="tab-scanner" class="tab-content active" aria-label="Opportunity Authenticity Scanner">
        <div id="scanner-container"></div>
      </section>

      <!-- TAB 2: AI Career Assistant Chatbot -->
      <section id="tab-chat" class="tab-content" aria-label="AI Career Assistant">
        <div id="chat-container"></div>
      </section>

      <!-- TAB 3: Verified Opportunities Feed -->
      <section id="tab-feed" class="tab-content" aria-label="Verified Opportunities Feed">
        <div id="feed-container"></div>
      </section>

      <!-- TAB 4: Student Forum & Scam Reports -->
      <section id="tab-forum" class="tab-content" aria-label="Peer Scam Intelligence Forum">
        <div id="forum-container"></div>
      </section>

      <!-- TAB 5: Mentors & Peer Network -->
      <section id="tab-mentors" class="tab-content" aria-label="Mentors and Student Network">
        <div id="mentors-container"></div>
      </section>

      <!-- TAB 6: Personal Vault / History -->
      <section id="tab-history" class="tab-content" aria-label="Scan History Vault">
        <div id="history-container"></div>
      </section>
    </main>
  </div>

  <!-- Main ES Module Script -->
  <script type="module" src="/static/js/app.js"></script>
  <!-- Fallback relative path for standalone preview -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
